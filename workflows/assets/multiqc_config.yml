report_comment: >
  This report has been generated by the <a href="https://github.com/foi-bioinformatics/nanometanf/tree/dev" target="_blank">foi-bioinformatics/nanometanf</a>
  analysis pipeline.
report_section_order:
  "foi-bioinformatics-nanometanf-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "foi-bioinformatics-nanometanf-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Strip intermediate processing suffixes from sample names so that
# all tools (Kraken2, SeqKit, FastQC, NanoPlot) report under a single
# row per sample in General Statistics.  CHOPPER outputs files named
# {sample}.chopped.fastq.gz and downstream tools propagate that suffix
# into their own output filenames and internal data columns.
extra_fn_clean_exts:
  - ".chopped"
