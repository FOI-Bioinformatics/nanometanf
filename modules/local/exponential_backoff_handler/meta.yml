name: exponential_backoff_handler
description: Implement exponential backoff strategy for retrying failed tasks
keywords:
  - error handling
  - exponential backoff
  - retry logic
  - reliability
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - retry_attempt:
      type: integer
      description: Current retry attempt number (0-indexed)
  - backoff_config:
      type: map
      description: |
        Exponential backoff configuration
        e.g. [ base_delay:1, max_delay:300, multiplier:2, jitter:true ]

output:
  - delay_recommendation:
      type: file
      description: Recommended delay before next retry
      pattern: "delay_recommendation.json"
  - backoff_state:
      type: file
      description: Current backoff state and history
      pattern: "backoff_state.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
