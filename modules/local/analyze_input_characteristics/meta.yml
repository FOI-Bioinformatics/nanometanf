name: analyze_input_characteristics
description: Analyze input data characteristics for dynamic resource allocation
keywords:
  - analysis
  - resource allocation
  - input characterization
  - optimization
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ['PSF']

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', input_type:'fastq' ]
  - input_files:
      type: file
      description: Input files to analyze
      pattern: "*"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', input_type:'fastq' ]
  - characteristics:
      type: file
      description: JSON file containing input characteristics
      pattern: "*_characteristics.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
