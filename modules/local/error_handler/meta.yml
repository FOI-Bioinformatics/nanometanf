name: error_handler
description: Centralized error handling with retry logic and recovery strategies
keywords:
  - error handling
  - retry logic
  - recovery
  - fault tolerance
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - error_classification:
      type: file
      description: Error classification from error_classifier
      pattern: "*_classification.json"
  - failed_task_data:
      type: file
      description: Data from the failed task
      pattern: "*"
  - handler_config:
      type: map
      description: |
        Error handler configuration
        e.g. [ max_retries:3, retry_strategy:'exponential', enable_dlq:true ]

output:
  - handling_result:
      type: file
      description: Result of error handling (retry/dlq/abort)
      pattern: "*_handling_result.json"
  - recovery_plan:
      type: file
      description: Recovery plan if task can be retried
      pattern: "*_recovery_plan.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
