name: predict_resource_requirements
description: Predict resource requirements based on input characteristics
keywords:
  - prediction
  - resource allocation
  - optimization
  - machine learning
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - input_characteristics:
      type: file
      description: Input characteristics JSON from analyze_input_characteristics
      pattern: "*_characteristics.json"
  - historical_data:
      type: file
      description: Historical resource usage data (optional)
      pattern: "*_historical.json"

output:
  - predictions:
      type: file
      description: Predicted resource requirements
      pattern: "*_predictions.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
