name: resource_optimization_profiles
description: Manage and apply resource optimization profiles for different scenarios
keywords:
  - profiles
  - resource optimization
  - configuration management
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - profile_name:
      type: string
      description: |
        Name of the optimization profile to apply
        e.g. 'minion', 'promethion', 'high_throughput', 'low_latency'
  - system_metrics:
      type: file
      description: Current system metrics
      pattern: "system_metrics.json"

output:
  - profile_config:
      type: file
      description: Profile configuration to apply
      pattern: "*_profile.config"
  - profile_report:
      type: file
      description: Profile application report
      pattern: "*_profile_report.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
