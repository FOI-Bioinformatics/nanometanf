name: generate_realtime_report
description: Generate interactive HTML reports for real-time monitoring of nanopore sequencing
keywords:
  - reporting
  - visualization
  - real-time
  - monitoring
  - nanopore
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - batch_meta:
      type: map
      description: |
        Groovy Map containing batch metadata
        e.g. [ batch_id:'batch001', batch_time:'20240101_120000' ]
  - snapshot_stats:
      type: file
      description: JSON file containing current batch snapshot statistics
      pattern: "*.snapshot.json"
  - cumulative_stats:
      type: file
      description: JSON file containing cumulative session statistics
      pattern: "*.cumulative.json"
  - stats_config:
      type: map
      description: |
        Configuration for statistics and reporting
        e.g. [ pipeline_version:'1.3.3', refresh_interval_ms:30000 ]

output:
  - batch_meta:
      type: map
      description: |
        Groovy Map containing batch metadata
        e.g. [ batch_id:'batch001', batch_time:'20240101_120000' ]
  - html:
      type: file
      description: Interactive HTML report with real-time statistics
      pattern: "realtime_report_*.html"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
