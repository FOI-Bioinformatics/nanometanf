name: pipeline_validator
description: Comprehensive validation system for pipeline inputs, outputs, and integrity
keywords:
  - validation
  - quality control
  - pipeline integrity
  - error detection
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', validation_type:'comprehensive' ]
  - input_files:
      type: file
      description: Files to validate (FASTQ, POD5, JSON, etc.)
      pattern: "*"
  - validation_config:
      type: map
      description: |
        Validation configuration parameters
        e.g. [ enable_checksums:true, enable_format_validation:true ]

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', validation_type:'comprehensive' ]
  - report:
      type: file
      description: Detailed JSON validation report
      pattern: "*.validation_report.json"
  - summary:
      type: file
      description: Human-readable validation summary
      pattern: "*.validation_summary.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
