name: kraken2_batch_processor
description: Process Kraken2 classification in batches for real-time and high-throughput scenarios
keywords:
  - metagenomics
  - taxonomy
  - kraken2
  - batch processing
  - optimization
tools:
  - kraken2:
      description: Taxonomic classification system using exact k-mer matches
      homepage: https://ccb.jhu.edu/software/kraken2/
      documentation: https://github.com/DerrickWood/kraken2/wiki
      tool_dev_url: https://github.com/DerrickWood/kraken2
      doi: "10.1186/s13059-019-1891-0"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample and batch information
        e.g. [ id:'sample1', batch_id:1, single_end:false ]
  - reads:
      type: file
      description: Input FASTQ files for classification
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - db:
      type: directory
      description: Kraken2 database directory
  - batch_config:
      type: map
      description: |
        Batch processing configuration
        e.g. [ memory_mapping:true, use_optimizations:true ]

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample and batch information
        e.g. [ id:'sample1', batch_id:1 ]
  - output:
      type: file
      description: Kraken2 classification output
      pattern: "*.kraken2.output.txt"
  - report:
      type: file
      description: Kraken2 taxonomic report
      pattern: "*.kraken2.report.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
