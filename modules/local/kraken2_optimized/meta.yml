name: kraken2_optimized
description: Optimized Kraken2 classification with memory mapping and performance enhancements
keywords:
  - metagenomics
  - taxonomy
  - kraken2
  - optimization
  - memory mapping
tools:
  - kraken2:
      description: Taxonomic classification system using exact k-mer matches
      homepage: https://ccb.jhu.edu/software/kraken2/
      documentation: https://github.com/DerrickWood/kraken2/wiki
      tool_dev_url: https://github.com/DerrickWood/kraken2
      doi: "10.1186/s13059-019-1891-0"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', single_end:false ]
  - reads:
      type: file
      description: Input FASTQ files
      pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
  - db:
      type: directory
      description: Kraken2 database directory
  - save_output_fastqs:
      type: boolean
      description: Save classified and unclassified reads to FASTQ files
  - save_reads_assignment:
      type: boolean
      description: Save per-read classification assignments
  - use_memory_mapping:
      type: boolean
      description: Enable memory-mapped database loading to reduce RAM usage
  - confidence_threshold:
      type: float
      description: Confidence score filter (0.0-1.0)
  - minimum_hit_groups:
      type: integer
      description: Minimum number of hit groups required for classification

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'sample1', single_end:false ]
  - classified_reads_fastq:
      type: file
      description: Classified reads in FASTQ format (optional)
      pattern: "*.classified{.,_}*"
  - unclassified_reads_fastq:
      type: file
      description: Unclassified reads in FASTQ format (optional)
      pattern: "*.unclassified{.,_}*"
  - classified_reads_assignment:
      type: file
      description: Per-read classification assignments (optional)
      pattern: "*classifiedreads.txt"
  - report:
      type: file
      description: Kraken2 taxonomic report
      pattern: "*.kraken2.report.txt"
  - performance_metrics:
      type: file
      description: Performance metrics JSON
      pattern: "*.performance.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
