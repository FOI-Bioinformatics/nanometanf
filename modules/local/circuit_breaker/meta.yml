name: circuit_breaker
description: Circuit breaker pattern for preventing cascade failures in pipeline processes
keywords:
  - error handling
  - circuit breaker
  - fault tolerance
  - reliability
  - experimental
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - process_status:
      type: file
      description: Status information from monitored process
      pattern: "*_status.json"
  - circuit_config:
      type: map
      description: |
        Circuit breaker configuration
        e.g. [ failure_threshold:5, timeout_duration:60, half_open_requests:3 ]

output:
  - circuit_state:
      type: file
      description: Current circuit breaker state (open/closed/half-open)
      pattern: "circuit_state.json"
  - action_recommendation:
      type: file
      description: Recommended action based on circuit state
      pattern: "action_recommendation.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
