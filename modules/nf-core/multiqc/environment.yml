---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  # Pin python: without it conda solves the latest (python 3.14), which multiqc
  # 1.34 does not support -- it crashes at startup (rich_click/click under 3.14),
  # failing the MULTIQC process and ending otherwise-successful runs with errors.
  # 3.12 is well within multiqc 1.34's supported range. Remove the pin when the
  # module is bumped to a multiqc release that supports 3.14.
  - conda-forge::python=3.12
  - bioconda::multiqc=1.34
