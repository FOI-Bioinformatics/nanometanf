name: nf-test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nextflow 26.04.0 is the floor. The pipeline has been ported to the
# strict v2 grammar (default in Nextflow 26+), so no parser opt-in is
# needed.
env:
  NXF_VER: "26.04.0"
  NXF_OFFLINE: "true"

jobs:
  test:
    name: Run nf-test (stub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"

      - name: Run nf-test
        run: nf-test test --profile test
