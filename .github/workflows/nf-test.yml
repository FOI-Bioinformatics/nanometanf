name: nf-test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nextflow 26.04.0 is the floor. The watchPath / FileAlterationMonitor
# cleanup hang that bit 25.10.x is no longer reproducible, so the
# 25.04.7 NXF_VER pin (task #26) is gone. NXF_SYNTAX_PARSER=v1 keeps the
# legacy Groovy idioms still present in several subworkflows parseable
# under the new strict grammar in 26 -- mirror this in
# bin/run-nf-tests.sh for local invocations.
env:
  NXF_VER: "26.04.0"
  NXF_OFFLINE: "true"
  NXF_SYNTAX_PARSER: "v1"

jobs:
  test:
    name: Run nf-test (stub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"

      - name: Run nf-test
        run: nf-test test --profile test
