name: nf-test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nextflow 26.04.0 is the floor (manifest in nextflow.config). The
# pipeline parses under the strict v2 grammar (default in 26+); no
# parser opt-in is needed. The matrix exercises the floor and the
# moving "latest-everything" target so regressions in either are
# caught at PR time.
#
# NXF_OFFLINE is intentionally NOT set: nf-schema (declared in
# nextflow.config) must be downloaded before validateParameters() can
# run, and the GitHub runner has no Nextflow plugin cache to satisfy
# the offline mode.

jobs:
  test:
    name: Run nf-test (${{ matrix.NXF_VER }})
    runs-on: ubuntu-latest
    # Hard cap the nf-test run so a stuck realtime / watchPath test
    # cannot consume the default 6 h GitHub job budget. Historical
    # runtime is roughly 20 min; 45 min is a generous ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.0"
          - "latest-everything"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"

      - name: Run nf-test
        run: nf-test test --profile test

  profile-sanity:
    # Stub-mode sanity check that each platform profile loads cleanly,
    # the Kraken2 cpus/memory closures resolve, and resourceLimits stay
    # within bounds. Catches config regressions before they reach users.
    name: Profile config (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - minion
          - promethion_8
          - promethion
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.0"

      - name: Render config for profile
        run: nextflow config -profile ${{ matrix.profile }} > /dev/null

      - name: Stub-run pipeline under profile
        # Booleans go via -params-file rather than CLI flags so nf-schema
        # 2.6+ sees the real boolean type rather than the string the CLI
        # would coerce them to.
        run: |
          cat > sanity-params-${{ matrix.profile }}.json <<JSON
          {
              "outdir": "results-${{ matrix.profile }}",
              "skip_kraken2": true
          }
          JSON
          nextflow run main.nf \
            -profile ${{ matrix.profile }},test \
            -stub \
            -params-file sanity-params-${{ matrix.profile }}.json
