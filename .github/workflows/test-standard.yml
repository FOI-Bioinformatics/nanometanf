name: Standard Test Validation (All Core)

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  standard-validation:
    name: Standard CI - All Core Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        nxf_version: ['25.10.0']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_version }}

      - name: Setup Java for nf-test
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install nf-test
        run: |
          wget -qO- https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run Standard Test Suite (all core tests)
        run: |
          nf-test test --tag core --profile test,docker --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-test-results-${{ matrix.os }}-nf${{ matrix.nxf_version }}
          path: |
            .nf-test/reports/
            .nf-test.log

      - name: Test Summary
        if: always()
        run: |
          echo "## Standard Test Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Nextflow Version:** ${{ matrix.nxf_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Scope:** All core functionality (fast + medium + slow)" >> $GITHUB_STEP_SUMMARY
          echo "**Expected Duration:** ~15 minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed test reports." >> $GITHUB_STEP_SUMMARY
