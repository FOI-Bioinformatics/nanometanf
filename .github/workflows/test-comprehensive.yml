name: Comprehensive Test Validation (Full Suite)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 3 * * 0'  # Run weekly on Sundays at 3 AM UTC

jobs:
  comprehensive-validation:
    name: Comprehensive CI - Full Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      matrix:
        os: [ubuntu-latest]
        nxf_version: ['25.10.0']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_version }}

      - name: Setup Java for nf-test
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install nf-test
        run: |
          wget -qO- https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run Comprehensive Test Suite (all tests)
        run: |
          nf-test test --profile test,docker --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-results-${{ matrix.os }}-nf${{ matrix.nxf_version }}
          path: |
            .nf-test/reports/
            .nf-test.log

      - name: Generate Test Coverage Report
        if: always()
        run: |
          echo "## Comprehensive Test Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Nextflow Version:** ${{ matrix.nxf_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Scope:** Complete test suite (core + extended + experimental)" >> $GITHUB_STEP_SUMMARY
          echo "**Expected Duration:** ~45 minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Categories Executed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Module tests (20 files)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Subworkflow tests (15 files)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pipeline tests (22 files)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed test reports." >> $GITHUB_STEP_SUMMARY
