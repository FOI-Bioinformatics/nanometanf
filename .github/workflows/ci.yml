name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Pipeline (${{ matrix.NXF_VER }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.0"
          - "latest-everything"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Verify syntax (dry-run)
        # Booleans go via -params-file rather than CLI flags so nf-schema
        # 2.6+ sees the real boolean type rather than the string the CLI
        # would coerce them to.
        run: |
          cat > ci-params.json <<'JSON'
          {
              "input": "assets/test_samplesheet.csv",
              "outdir": "test_output",
              "skip_kraken2": true,
              "validate_params": false
          }
          JSON
          nextflow run main.nf -preview -params-file ci-params.json

      - name: Verify help output
        run: nextflow run main.nf --help
