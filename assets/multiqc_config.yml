report_comment: >
  This report has been generated by the <a href="https://github.com/foi-bioinformatics/nanometanf/releases/tag/1.10.0" target="_blank">foi-bioinformatics/nanometanf</a> analysis pipeline.
report_section_order:
  "foi-bioinformatics-nanometanf-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "foi-bioinformatics-nanometanf-summary":
    order: -1002
  nanopore_sequencing:
    order: -950
  kraken2_taxonomy:
    order: -920
  nanoplot:
    order: -900
  fastp_qc:
    order: -880
  fastqc_qc:
    order: -870
  filtlong_qc:
    order: -860
  seqkit_stats:
    order: -850
  minimap2_validation:
    order: -800

export_plots: true

disable_version_detection: true

# Strip intermediate processing suffixes from sample names so that
# all tools (Kraken2, SeqKit, FastQC, NanoPlot) report under a single
# row per sample in General Statistics.  CHOPPER outputs files named
# {sample}.chopped.fastq.gz and downstream tools propagate that suffix
# into their own output filenames and internal data columns.
extra_fn_clean_exts:
  - ".chopped"

# Custom content for nanopore-specific modules (Section 4.2)
custom_data:
  nanopore_stats:
    file_format: "json"
    section_name: "Nanopore Sequencing Statistics"
    description: "Oxford Nanopore sequencing run metrics including read length, quality, and yield"
    plot_type: "table"
    pconfig:
      namespace: "Nanopore"

  kraken2_krona:
    file_format: "html"
    section_name: "Taxonomic Classification (Krona)"
    description: "Interactive hierarchical visualization of Kraken2 taxonomic classification results"

# Enable NanoPlot module for nanopore-specific QC visualization
# NanoPlot generates comprehensive quality metrics including:
# - Read length distributions (weighted and non-weighted)
# - Quality score distributions
# - Length vs Quality scatter plots
# - Yield over time analysis
sp:
  nanoplot:
    fn: "NanoStats.txt"

  # Custom nanopore stats files
  nanopore_stats:
    fn: "*_nanopore_stats_mqc.json"

  # Read length distribution plots
  read_length_dist:
    fn: "*_read_length_mqc.json"

  # Quality distribution plots
  quality_dist:
    fn: "*_quality_mqc.json"

  # Kraken2 Krona plots
  krona:
    fn: "*.krona.html"

# Module-specific configurations
module_order:
  - nanopore_stats:
      name: "Nanopore Sequencing"
      anchor: "nanopore_sequencing"
      info: "Comprehensive nanopore sequencing statistics"
  - kraken2:
      name: "Kraken2 Classification"
      anchor: "kraken2_taxonomy"
  - nanoplot:
      name: "NanoPlot QC"
  - fastp:
      name: "FASTP"
      anchor: "fastp_qc"
      info: "Adapter trimming and quality filtering metrics (FASTP path)"
  - fastqc:
      name: "FastQC"
      anchor: "fastqc_qc"
      info: "Per-base quality, GC content, adapter and overrepresentation checks"
  - filtlong:
      name: "Filtlong"
      anchor: "filtlong_qc"
      info: "Length and quality filtering metrics (Filtlong path)"
  - seqkit:
      name: "SeqKit stats"
      anchor: "seqkit_stats"
      info: "Per-sample read counts, length distributions and N50"
  - samtools:
      name: "samtools / minimap2"
      anchor: "minimap2_validation"
      info: "Alignment statistics for the minimap2 validation path"
# Chopper and BLAST do not yet ship native MultiQC modules. Their
# metrics surface through the canonical_qc_writer / canonical_validation_writer
# JSON outputs and through the per-tool publishDir under chopper/ and
# validation/blast/; they are intentionally absent here until upstream
# modules land or a custom_data wrapper is added.
