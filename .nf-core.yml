repository_type: pipeline

# Synced by hand to the 4.2.1 template on 2026-10-29 (the repository has no
# TEMPLATE branch for `nf-core pipelines sync`): nf-schema 2.7.3, the three
# utils_* subworkflows at the template's pinned commits, the pipeline-utils
# subworkflow interface (help flags in, hook_url out) and main.nf's calls.
# One step ahead of that template since the same day: nf-schema 3.0.0 and
# the utils_* subworkflows at nf-core/modules master (7b3452a), which the
# template still pins at 2.7.3 (see docs/development/nfcore_module_maintenance.md).
nf_core_version: 4.2.1

lint:
  files_exist:
    - lib/WorkflowNanometanf.groovy
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nanometanf_logo_light.png
    - docs/images/nf-core-nanometanf_logo_light.png
    - docs/images/nf-core-nanometanf_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    # Community-template CI files not used by this internal pipeline (is_nfcore: false)
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    # pr-comment.yml is the 4.x successor to linting_comment.yml above: it
    # posts the lint report back onto the pull request, which needs the
    # nf-core bot. Same reason, same answer.
    - .github/workflows/pr-comment.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    # The 4.x template moved CONTRIBUTING.md under docs/. This repository
    # keeps it at .github/CONTRIBUTING.md -- GitHub's own location, which is
    # what the "Contributing guidelines" link in the PR sidebar reads -- and
    # that copy is pinned under files_unchanged below.
    - docs/CONTRIBUTING.md
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - LICENSE
    - .github/workflows/linting.yml
    - .github/workflows/linting_comment.yml
    - .prettierignore
    - assets/nf-core-nanometanf_logo_light.png
    - docs/images/nf-core-nanometanf_logo_light.png
    - docs/images/nf-core-nanometanf_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  # Institutional configs are opt-in (see params.custom_config_base above);
  # this release-mode check asks for the includeConfig line to be
  # unconditional, which would reintroduce the failure it guards against.
  included_configs: false
  nextflow_config:
    - manifest.name
    - manifest.homePage
    # Remote institutional configs are opt-in here: with the nf-core URL as
    # the default, every online launch died on a transient GitHub error
    # (HTTP 429 -> "Unable to parse config file", 2026-08-17), and an
    # air-gapped launch cannot fetch it at all. See the comment at
    # nextflow.config:232. nanometanf is not an official nf-core pipeline.
    - custom_config
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
    # The legacy max_cpus / max_memory / max_time params are declared
    # intentionally so platform profiles (conf/minion.config,
    # conf/promethion.config, conf/promethion_8.config) can scale the
    # Kraken2 cpus closure against them. nf-core 3.0+ recommends using
    # process.resourceLimits instead, which the pipeline does as well,
    # but the explicit params remain user-facing for compatibility.
    - params.max_cpus
    - params.max_memory
    - params.max_time
  multiqc_config:
    - report_comment
  # Pipeline-level integration tests (nextflow_pipeline {}) do not snapshot
  # a single versions.yml channel the way module/subworkflow tests do, so
  # the nf_test_content rule does not apply cleanly. The subworkflow-local
  # tests under subworkflows/**/tests/ remain subject to the rule.
  nf_test_content:
    - tests/realtime_statistics_modules.nf.test
    - tests/realtime_empty_samplesheet.nf.test
    - tests/barcode_discovery.nf.test
    - tests/main_workflow.nf.test
    - tests/default.nf.test
    - tests/nanoseq_test.nf.test
    - tests/parameter_validation.nf.test
    - tests/chopper_specific.nf.test
    - tests/input_scanner.nf.test
    - tests/qc_tool_integration.nf.test
    - tests/full_pipeline_stubmode.nf.test
    - tests/multiplex_scaling.nf.test
    - tests/ifempty_sentinel_regression.nf.test
    - tests/batch_input_modes.nf.test
    - tests/realtime_input_modes.nf.test
    - tests/realtime_classification.nf.test
    - tests/classification_real.nf.test
    - tests/realtime_validation_e2e.nf.test
    - tests/realtime_timeout_exit_regression.nf.test
    - tests/validation_only_discovery.nf.test
    - tests/validation_assembly_stub_matrix.nf.test
    - tests/field_profile_paths.nf.test
    - tests/failure_paths.nf.test
    - tests/realtime_backlog_chunking.nf.test
  # The .github/workflows/nf-test.yml in this repo is a customised CI matrix
  # (the wrapper at bin/run-nf-tests.sh sets NXF_OFFLINE only) and
  # does not match the nf-core community-template event triggers. The
  # divergence is intentional, so disable the check.
  actions_nf_test: false
  # The pipeline-level lint config below cannot suppress subworkflow-internal
  # checks (main_nf_include_versions, meta_name, subworkflow_include) because
  # the subworkflow linter does not honour per-rule ignores (re-checked with
  # nf-core/tools 4.2.1 on 2026-10-29: `subworkflow_include: false` and
  # `meta_name: false` here change nothing). demultiplexing, input_scanner
  # and realtime_monitoring are channel logic with no process of their own,
  # so their subworkflow_include warning is the shape, not an omission. The residual
  # warnings on subworkflows/local/utils_nfcore_nanometanf_pipeline are
  # inherent to the nf-core utility-subworkflow pattern: the helper functions
  # imported from utils_nfcore_pipeline (completionEmail, completionSummary,
  # imNotification) and the UTILS_* subworkflows do not expose `.out.versions`
  # via the legacy versions channel because they use topic channels instead,
  # and the file declares two workflow blocks (PIPELINE_INITIALISATION and
  # PIPELINE_COMPLETION) so meta.yml's single name cannot match both. These
  # warnings are accepted as documented divergences from the lint defaults.

template:
  org: foi-bioinformatics
  name: nanometanf
  description: Backend of Nanometa-Live
  author: "Andreas Sjodin"
  version: 1.12.0dev
  force: true
  outdir: .
  skip_features:
    - gpu
  is_nfcore: false
