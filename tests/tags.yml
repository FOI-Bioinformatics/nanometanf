# Test Tag System for nanometanf Pipeline
# =========================================
#
# Simple 4-tag system for organizing tests.
#
# Usage:
#   nf-test test --tag core --tag fast    # Quick validation
#   nf-test test --tag core               # All core tests
#   nf-test test                          # Full test suite
#
# Last Updated: 2025-11-29

# Essential Tags (required for each test)
# =======================================

criticality:
  core:
    description: Must-pass tests for CI
    example: nf-test test --tag core

  extended:
    description: Nice-to-pass tests (release validation)
    example: nf-test test --tag extended

speed:
  fast:
    description: Quick tests (< 1 minute)
    example: nf-test test --tag fast

  slow:
    description: Longer tests (> 1 minute)
    example: nf-test test --tag slow

# Optional Feature Tags (for targeted debugging)
# ==============================================

features:
  realtime:
    description: Real-time processing tests
  qc:
    description: Quality control tests
  classification:
    description: Taxonomic classification tests
  barcode_discovery:
    description: Barcode discovery tests
  validation:
    description: BLAST validation tests

# Test Structure Tags (optional)
# ==============================

structure:
  pipeline:
    description: Full pipeline tests
  subworkflow:
    description: Subworkflow tests
  module:
    description: Individual module tests
  integration:
    description: Integration tests
# Usage Example
# =============
#
# nextflow_pipeline {
#     tag "core"          // Required: criticality
#     tag "fast"          // Required: speed
#     tag "qc"            // Optional: feature
#
#     test("...") { ... }
# }
